name: Windows conformance
on: [push, pull_request]
permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      TUNNEL_PROVIDER: none
      NGROK_ENABLED: 'false'
      FULL_ACCESS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Reject tracked local files and generated builds
        run: node scripts/check-tracked.mjs
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:conformance
      - run: npm run test:desktop-control
      - run: npm run test:monitor
