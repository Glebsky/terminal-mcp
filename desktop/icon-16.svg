<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34508C"/>
      <stop offset="1" stop-color="#0E1739"/>
    </linearGradient>
    <linearGradient id="planet" gradientUnits="userSpaceOnUse" x1="0" y1="13.5" x2="0" y2="16">
      <stop offset="0" stop-color="#2F6FE6"/>
      <stop offset="1" stop-color="#1A3C9A"/>
    </linearGradient>
    <linearGradient id="air" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A498FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ADF3F4"/>
      <stop offset="1" stop-color="#A498FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="plate">
      <rect width="16" height="16" rx="3.75"/>
    </clipPath>
  </defs>
  <rect width="16" height="16" rx="3.75" fill="url(#bg)"/>
  <g clip-path="url(#plate)">
    <circle cx="8" cy="25.5" r="12" fill="url(#planet)"/>
    <circle cx="8" cy="25.5" r="12" fill="none" stroke="url(#air)" stroke-width=".9"/>
  </g>
  <g shape-rendering="crispEdges">
    <rect x="1" y="7" width="14" height="2" fill="#93A3BE"/>
    <rect x="1" y="4" width="2" height="3" fill="#7C8EFF"/>
    <rect x="1" y="9" width="2" height="3" fill="#7C8EFF"/>
    <rect x="13" y="4" width="2" height="3" fill="#7C8EFF"/>
    <rect x="13" y="9" width="2" height="3" fill="#7C8EFF"/>
    <rect x="7" y="3" width="2" height="1" fill="#93A3BE"/>
    <rect x="7" y="2" width="2" height="1" fill="#FFB48C"/>
    <rect x="4" y="4" width="8" height="8" fill="#E6ECF5"/>
    <rect x="5" y="5" width="6" height="6" fill="#0A1430"/>
    <rect x="6" y="6" width="1" height="1" fill="#B4FFF2"/>
    <rect x="7" y="7" width="1" height="1" fill="#B4FFF2"/>
    <rect x="6" y="8" width="1" height="1" fill="#B4FFF2"/>
    <rect x="8" y="9" width="2" height="1" fill="#B4FFF2"/>
  </g>
</svg>
